name: PresidentialArchive
options:
  bundleIdPrefix: com.molab.presidentialarchive
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  PresidentialArchive-iOS:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Sources/PresidentialArchive
    settings:
      base:
        PRODUCT_NAME: PresidentialArchive
        PRODUCT_BUNDLE_IDENTIFIER: com.molab.presidentialarchive.ios
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: 'Presidential Archive'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'

  PresidentialArchive-macOS:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: Sources/PresidentialArchive
    settings:
      base:
        PRODUCT_NAME: PresidentialArchive
        PRODUCT_BUNDLE_IDENTIFIER: com.molab.presidentialarchive.macos
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: 'Presidential Archive'
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
        ENABLE_HARDENED_RUNTIME: 'YES'
        COMBINE_HIDPI_IMAGES: 'YES'
    entitlements:
      path: Sources/PresidentialArchive/Support/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true

schemes:
  PresidentialArchive-iOS:
    build:
      targets:
        PresidentialArchive-iOS: all
    run:
      config: Debug
  PresidentialArchive-macOS:
    build:
      targets:
        PresidentialArchive-macOS: all
    run:
      config: Debug
