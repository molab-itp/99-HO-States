<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HO-States-US</title>
    <style>
      :root {
        color-scheme: light dark;
        --tint: #b3212e;
        --bg: canvas;
        --text: canvastext;
        --secondary-text: #6e6e73;
        --border: rgba(127, 127, 127, 0.3);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 32px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .icon {
        font-size: 64px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p.subtitle {
        margin: 0;
        color: var(--secondary-text);
        max-width: 360px;
      }
      .versions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 320px;
      }
      .versions a {
        display: block;
        padding: 14px 20px;
        border-radius: 12px;
        border: 1.5px solid var(--tint);
        color: var(--tint);
        text-decoration: none;
        font-weight: 600;
      }
      .versions a:hover {
        background: rgba(179, 33, 46, 0.08);
      }
      .versions .name {
        display: block;
      }
      .versions .desc {
        display: block;
        font-weight: 400;
        font-size: 13px;
        color: var(--secondary-text);
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="icon">🏛️</div>
    <h1>HO-States-US</h1>
    <p class="subtitle">Browse portraits and biographies of every US president. Same app, built
      several times over — pick a version.</p>
    <div class="versions">
      <a href="v4/">
        <span class="name">v4 — React</span>
        <span class="desc">Web app, React-Native-friendly structure</span>
      </a>
    </div>
  </body>
</html>
